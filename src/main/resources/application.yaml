spring:
  main:
    banner-mode: CONSOLE
  application:
    version: 1.0.0
    name: QR-MENU-SYSTEM
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: mysql

server:
  port: ${PORT:9090}